<!doctype html><html><head><meta charset=utf-8><style>
@page{size:210mm 297mm;margin:0} body{margin:0;font-family:Helvetica}
.bg{position:absolute;left:0;top:0;width:210mm;height:60mm;background:#e30613}
.k{position:absolute;left:10mm;top:70mm;font-size:12pt;color:#000}
.grad{position:absolute;left:10mm;top:90mm;width:90mm;height:40mm;background:linear-gradient(90deg,#00a0e9,#fff100)}

<img src=alpha.png style="left:110mm;top:185mm;width:50mm">
