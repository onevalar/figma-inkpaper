<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<style>
/* Tokens follow the Linear light / dark themes of the custom HeroUI v3 library (heroui-v3-custom).
   Figma adds .figma-dark to <html> when its UI is dark. */
:root {
  --bg: oklch(1 0 0);
  --surface: oklch(0.97 0.002 260);
  --surface-2: oklch(0.932 0.004 260);
  --default: oklch(0.895 0.006 260);
  --line: oklch(0.912 0.005 260);
  --field-border: oklch(0.82 0.011 260);
  --fg: oklch(0.22 0.011 260);
  --fg2: oklch(0.445 0.012 260);
  --fg3: oklch(0.52 0.012 260);
  --accent: oklch(0.52 0.167 259.7);
  --accent-fg: oklch(1 0 0);
  --accent-soft: oklch(0.52 0.167 259.7 / 0.08);
  --ok: oklch(0.55 0.15 146.7);
  --warn: oklch(0.6 0.13 75);
  --warn-dot: oklch(0.825 0.169 90);
  --danger: oklch(0.6 0.183 23.7);
  --info: oklch(0.6 0.12 230);
  --shadow: 0 1px 2px oklch(0 0 0 / 0.08);
  --overlay-shadow: 0 24px 40px -12px oklch(0 0 0 / 0.08), 0 4px 6px -2px oklch(0 0 0 / 0.04), 0 0 0 1px oklch(0 0 0 / 0.04);
  --toggle-off: oklch(0.82 0.011 260);
  --radius: 8px;
  --radius-sm: 6px;
  --font: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  --mono: ui-monospace, "SFMono-Regular", Menlo, Monaco, Consolas, monospace;
  color-scheme: light;
}
html.figma-dark {
  --bg: oklch(0.172 0.002 197);
  --surface: oklch(0.205 0.003 248);
  --surface-2: oklch(0.231 0.002 286.3);
  --default: oklch(0.231 0.002 286.3);
  --line: oklch(0.243 0.004 264.5);
  --field-border: oklch(0.3 0.004 264.5);
  --fg: oklch(0.917 0.004 286.3);
  --fg2: oklch(0.649 0.015 262.4);
  --fg3: oklch(0.55 0.01 262);
  --accent: oklch(0.577 0.182 259.7);
  --accent-fg: oklch(1 0 0);
  --accent-soft: oklch(0.595 0.188 259.7 / 0.14);
  --ok: oklch(0.646 0.105 150.5);
  --warn: oklch(0.722 0.113 86.5);
  --warn-dot: oklch(0.722 0.113 86.5);
  --danger: oklch(0.605 0.138 25.8);
  --info: oklch(0.7 0.11 230);
  --shadow: 0 1px 2px oklch(0 0 0 / 0.4);
  --overlay-shadow: 0 16px 56px oklch(0 0 0 / 0.24), 0 0 0 1px oklch(0 0 0 / 0.1);
  --toggle-off: oklch(0.35 0.004 264.5);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font: 13px/1.45 var(--font); color: var(--fg); background: var(--bg); display: flex; flex-direction: column; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); text-decoration: none; cursor: pointer; }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--mono); font-size: 12px; }
.muted { color: var(--fg2); }
.xs { font-size: 11px; }
.sm { font-size: 12px; }
.grow { flex: 1; min-width: 0; }
.ell { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---- header ---- */
header { flex: none; display: flex; align-items: center; justify-content: space-between; padding: 12px 18px 0; gap: 12px; }
.steps { display: flex; flex: 1; min-width: 0; gap: 6px; }
.step { flex: 1 1 auto; min-width: max-content; min-height: 34px; display: flex; align-items: center; gap: 6px; background: none; border: 0; padding: 0; cursor: pointer; color: var(--fg2); font-size: 12px; white-space: nowrap; }
.step:not(:last-child)::after { content: ""; height: 1px; background: var(--line); flex: 1; min-width: 4px; pointer-events: none; }
.step .n { width: 22px; height: 22px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; border: 1px solid var(--field-border); background: var(--bg); flex: none; }
.step.on { color: var(--fg); font-weight: 600; }
.step.on .n { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.header-actions { display: flex; align-items: center; gap: 6px; flex: none; }
.header-actions .utility { height: 34px; padding: 0 8px; }
.header-actions .icon-only { width: 34px; padding: 0; }
.utility-label { max-width: 80px; overflow: hidden; text-overflow: ellipsis; }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

/* ---- layout ---- */
main { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: 18px; display: flex; flex-direction: column; gap: 16px; scrollbar-width: thin; }
main > * { flex: none; }
footer { flex: none; border-top: 1px solid var(--line); padding: 12px 18px; display: flex; flex-direction: column; gap: 8px; }
footer[hidden] { display: none; }
.dot { width: 7px; height: 7px; border-radius: 50%; flex: none; background: var(--fg3); }
.dot.ok { background: var(--ok); } .dot.warn { background: var(--warn-dot); } .dot.err { background: var(--danger); } .dot.info { background: var(--info); }

/* ---- type ---- */
h1 { font-size: 20px; font-weight: 600; letter-spacing: -0.01em; margin: 0; line-height: 1.3; }
.kicker { font-size: 11px; color: var(--fg2); letter-spacing: 0.04em; }
.section { display: flex; flex-direction: column; }
.section > .kicker { padding: 2px 0 4px; }
.hint { color: var(--fg2); font-size: 12px; margin: 0; line-height: 1.5; }

/* ---- controls (Linear: 32px fields, 8px radius) ---- */
.btn { height: 32px; border-radius: var(--radius); border: 1px solid var(--field-border); background: var(--bg); padding: 0 12px; cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-weight: 500; transition: background-color .1s; }
.btn:hover { background: var(--surface); }
.btn:active { transform: scale(.98); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.btn.primary:hover { filter: brightness(1.06); background: var(--accent); }
.btn.big { height: 40px; width: 100%; font-size: 14px; font-weight: 600; }
.btn.big .sub { font-weight: 400; opacity: .7; font-size: 12px; }
.btn.small { height: 28px; padding: 0 10px; font-size: 12px; }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--default); }
.btn:disabled { opacity: .45; cursor: default; transform: none; }
.link { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; font-size: 12px; font-weight: 500; }
.link.muted { color: var(--fg2); font-weight: 400; }
input[type=number], input[type=text], select, textarea { height: 32px; border: 1px solid var(--field-border); border-radius: var(--radius); background: var(--bg); padding: 0 8px; min-width: 0; outline: none; }
input[type=number] { width: 72px; }
input[type=text], select { flex: 1; }
select { padding-right: 4px; cursor: pointer; text-overflow: ellipsis; max-width: 100%; }
input:focus, select:focus, textarea:focus { border-color: var(--accent); }
input[type=checkbox] { accent-color: var(--accent); width: 15px; height: 15px; margin: 0; flex: none; }
input[type=range] { accent-color: var(--accent); }
.unit { color: var(--fg3); font-size: 12px; }

.seg { display: inline-flex; padding: 2px; gap: 2px; background: var(--surface-2); border-radius: var(--radius); flex: none; }
.seg button { border: 0; background: none; padding: 0 10px; height: 26px; border-radius: var(--radius-sm); cursor: pointer; color: var(--fg2); white-space: nowrap; font-size: 12px; }
.seg button:hover { color: var(--fg); }
.seg button.on { background: var(--bg); color: var(--fg); font-weight: 600; box-shadow: var(--shadow); }
html.figma-dark .seg button.on { background: var(--default); }
.seg.full { display: flex; }
.seg.full button { flex: 1; }

.chip { height: 28px; padding: 0 10px; border-radius: 14px; border: 1px solid var(--field-border); background: var(--bg); color: var(--fg2); cursor: pointer; display: inline-flex; align-items: center; gap: 5px; font-size: 12px; white-space: nowrap; }
.chip.on { background: var(--fg); border-color: var(--fg); color: var(--bg); }
.chip svg { flex: none; }

.toggle { width: 30px; height: 18px; border-radius: 9px; background: var(--toggle-off); position: relative; flex: none; border: 0; cursor: pointer; padding: 0; }
.toggle::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: transform .15s; box-shadow: var(--shadow); }
.toggle.on { background: var(--accent); }
.toggle.on::after { transform: translateX(12px); }

/* ---- rows ---- */
.row { display: flex; align-items: center; gap: 10px; min-height: 40px; }
.row > .lbl { width: 64px; flex: none; color: var(--fg2); font-size: 12px; }
.line { display: flex; align-items: center; gap: 10px; min-height: 36px; }
.line > .l { flex: 1; min-width: 0; }
.line > .r { flex: none; }
.divided > * + * { border-top: 1px solid var(--line); }
.rule { border-top: 1px solid var(--line); }
.chk { display: flex; align-items: center; gap: 8px; cursor: pointer; min-height: 32px; }
.chk .muted { font-size: 12px; }
.grid4 { display: flex; gap: 6px; }
.grid4 label { display: flex; align-items: center; gap: 4px; color: var(--fg2); font-size: 12px; }
.grid4 input { width: 54px; }

/* ---- cards ---- */
.card { border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; }
.card.warn { border-color: color-mix(in oklch, var(--warn-dot) 70%, transparent); background: color-mix(in oklch, var(--warn-dot) 8%, transparent); }
.card.strong { border-color: var(--fg); }
.well { background: var(--surface); border-radius: var(--radius); padding: 10px 12px; }
.pick { border: 1px solid var(--line); border-radius: var(--radius); padding: 10px; cursor: pointer; display: flex; flex-direction: column; gap: 8px; background: var(--bg); text-align: left; transition: border-color .1s; }
.pick:hover { border-color: var(--field-border); }
.pick.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.pick .t { font-weight: 600; font-size: 13px; }
.pick .d { font-size: 11px; color: var(--fg2); }
.pick .art { height: 56px; border-radius: var(--radius-sm); background: var(--surface); display: flex; align-items: center; justify-content: center; color: var(--fg); }
.pick.on .art { background: var(--accent-soft); color: var(--accent); }
.picks { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }

/* ---- profile card ---- */
.profile { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 1px solid var(--field-border); border-radius: var(--radius); cursor: pointer; background: var(--bg); width: 100%; text-align: left; }
.profile:hover { border-color: var(--fg3); }
.inks { display: flex; flex: none; }
.inks i { width: 12px; height: 26px; display: block; }
.inks i.sm { width: 4px; height: 16px; }
.inks i:first-child { border-radius: 3px 0 0 3px; } .inks i:last-child { border-radius: 0 3px 3px 0; }
.profile .name { font-size: 14px; font-weight: 600; }
.profile-copy { display: flex; flex-direction: column; gap: 3px; overflow-wrap: anywhere; }

/* ---- task workbench ---- */
h2 { font-size: 13px; line-height: 1.5; font-weight: 600; margin: 0; }
.view-heading { display: flex; flex-direction: column; gap: 6px; }
.section-title { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.workbench { gap: 14px; }
.workbench .profile { padding: 10px 12px; }
.output-settings { gap: 8px; }
.output-settings .row > .lbl { width: 60px; }
.output-settings .row > [role=group] { flex: 1; }
.output-settings .seg { display: flex; }
.output-settings .seg button { flex: 1; min-height: 30px; }
.output-settings .chk { font-size: 12px; }
.quality { display: flex; align-items: flex-start; gap: 10px; padding: 12px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
.quality .dot { margin-top: 6px; }
.quality .hint { margin-top: 3px; }
.quality > .btn { align-self: center; }
.quality.warn { background: color-mix(in oklab, var(--warn-dot) 8%, var(--bg)); border-color: color-mix(in oklab, var(--warn-dot) 42%, var(--line)); }
.quality.err { background: color-mix(in oklab, var(--danger) 5%, var(--bg)); }
.quality.ok { background: color-mix(in oklab, var(--ok) 5%, var(--bg)); }
.quality.compact { align-items: center; padding: 8px 12px; min-height: 40px; }
.quality.compact .dot { margin-top: 0; }
.quality.compact .link { display: inline-flex; align-items: center; gap: 4px; min-height: 28px; }
.pages-summary { background: var(--surface); border-radius: var(--radius); padding: 10px 12px; }
.pages-compact { display: flex; align-items: center; gap: 12px; }
.pages-copy { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 10px; }
.pages-compact > img { width: 24px; height: 34px; object-fit: contain; background: white; border: 1px solid var(--line); }
.pages-compact b { font-weight: 600; }
.pages-compact .link { display: flex; align-items: center; gap: 5px; min-height: 32px; }
#export-pages { padding-top: 12px; }
#export-pages .strip { margin-top: 8px; }
.advanced .disclose { min-height: 44px; }
#export-advanced { padding-top: 14px; }

/* ---- pages strip ---- */
.strip { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
.page { flex: none; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: grab; }
.page-select { border: 0; padding: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 5px; cursor: pointer; width: 100px; }
.page .pg { height: 72px; width: 60px; background: var(--bg); border: 1px solid var(--line); border-radius: 2px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.page .pg img { height: 100%; width: auto; display: block; }
.page .no { font-size: 11px; color: var(--fg2); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.page-order { display: flex; gap: 8px; }
.page-order button { border: 1px solid var(--field-border); background: var(--bg); border-radius: 4px; width: 32px; height: 28px; cursor: pointer; }
.page-order button:disabled { opacity: .4; cursor: default; }
.page.dragging { opacity: .4; }

/* ---- issues / lists ---- */
.issue-list { display: flex; flex-direction: column; gap: 10px; }
.issue-card { border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.issue-card p { margin: 0; }
.issue-card .msg { font-size: 12px; color: var(--fg2); line-height: 1.65; overflow-wrap: anywhere; }
.issue-actions { display: flex; align-items: center; gap: 8px 14px; flex-wrap: wrap; }
.issue-level { font-size: 11px; padding: 2px 6px; background: var(--surface); border-radius: 4px; }
.issue-level.error { color: var(--danger); }
.issue-level.warning { color: var(--warn); }
.crow { display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 8px; cursor: pointer; }
.crow:hover { background: var(--surface); }
.crow .sw2 { width: 28px; flex: none; display: flex; }
.crow .sw2 i { width: 14px; height: 22px; display: block; border: 1px solid oklch(0 0 0 / 0.08); }
.crow .sw2 i:first-child { border-radius: 4px 0 0 4px; border-right: 0; } .crow .sw2 i:last-child { border-radius: 0 4px 4px 0; }
.crow .val { width: 112px; flex: none; font-size: 12px; }
.crow .tag { width: 64px; flex: none; font-size: 11px; font-weight: 500; }
.crow .cnt { width: 28px; flex: none; font-size: 11px; color: var(--fg2); text-align: right; }
.cedit { background: var(--surface); padding: 4px 8px 12px; display: flex; flex-direction: column; gap: 8px; }
.cgroup.open { background: var(--surface); }
.cgroup.open .crow:hover { background: transparent; }
.slider { display: grid; grid-template-columns: 12px 1fr 44px; gap: 8px; align-items: center; }
.slider b { font-size: 11px; }
.slider input[type=number] { width: 44px; height: 24px; padding: 0 4px; }
.sliders { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 16px; }
.trow { display: flex; align-items: center; gap: 10px; min-height: 48px; }
.tag-warn { color: var(--warn); } .tag-err { color: var(--danger); } .tag-ok { color: var(--ok); } .tag-info { color: var(--info); } .tag-accent { color: var(--accent); }

/* ---- preview ---- */
.pv { position: relative; background: var(--surface); border-radius: var(--radius); padding: 28px 16px 36px; display: flex; justify-content: center; }
.pv canvas { max-width: 100%; max-height: 340px; display: block; box-shadow: 0 2px 8px oklch(0 0 0 / 0.12); }
.pv .lab { position: absolute; top: 8px; font-size: 11px; color: var(--fg2); }
.pv .pager { position: absolute; bottom: 8px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 10px; font-size: 11px; }
.pv .pager button { border: 0; background: none; cursor: pointer; color: var(--fg); font-size: 13px; padding: 0 4px; }
.pv .pager button:disabled { color: var(--fg3); cursor: default; }
.plate { width: 16px; height: 16px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 700; color: #fff; }
.chip.on .plate { box-shadow: 0 0 0 1.5px var(--bg); }
.stats { display: flex; }
.stats > div { flex: 1; padding: 8px 0 8px 12px; display: flex; flex-direction: column; gap: 2px; }
.stats > div:first-child { padding-left: 0; }
.stats > div + div { border-left: 1px solid var(--line); }
.stats b { font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; }

/* ---- sheets ---- */
.sheet-h { display: flex; align-items: center; gap: 8px; padding: 2px 0 10px; border-bottom: 1px solid var(--fg); }
.sheet-h .title { font-size: 16px; font-weight: 600; flex: 1; }
.back { border: 0; background: none; cursor: pointer; padding: 4px; margin-left: -4px; color: var(--fg); display: inline-flex; }
.disclose { display: flex; align-items: center; gap: 10px; padding: 12px 0; cursor: pointer; border: 0; background: none; width: 100%; text-align: left; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.disclose .t { font-weight: 600; }
.chev { transition: transform .15s; flex: none; color: var(--fg2); }
.open > .chev, .chev.open { transform: rotate(180deg); }
.tool { border-bottom: 1px solid var(--line); }
.tool-h { display: flex; align-items: center; gap: 12px; min-height: 50px; cursor: pointer; }
button.tool-h { border: 0; background: none; width: 100%; padding: 0; text-align: left; }
button.tool-h:hover { color: var(--accent); }
.tool-h .ic { width: 20px; display: flex; justify-content: center; flex: none; color: var(--fg); }
.tool-b { padding: 2px 0 14px 32px; display: flex; flex-direction: column; gap: 6px; }
.settings-group { display: flex; flex-direction: column; gap: 8px; }
.settings-group + .settings-group { border-top: 1px solid var(--line); padding-top: 16px; }
.settings-link { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; min-height: 44px; padding: 8px 0; border: 0; border-bottom: 1px solid var(--line); background: none; text-align: left; cursor: pointer; }
.settings-link:hover { color: var(--accent); }
.settings-help { color: var(--fg2); font-size: 12px; }
.settings-help summary { cursor: pointer; padding: 8px 0; }
.settings-help p { margin: 4px 0 8px; }
.radio { width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--field-border); flex: none; }
.radio.on { border: 5px solid var(--accent); }
.prow { display: flex; align-items: center; gap: 10px; min-height: 52px; cursor: pointer; }
.empty { color: var(--fg2); text-align: center; padding: 28px 12px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
.drop { display: flex; align-items: center; gap: 12px; padding: 14px; border: 1.5px dashed var(--field-border); border-radius: 12px; cursor: pointer; background: var(--bg); text-align: left; }
.drop:hover, .drop.over { border-color: var(--accent); background: var(--accent-soft); }
.stepper-n { display: inline-flex; align-items: center; border: 1px solid var(--field-border); border-radius: var(--radius); height: 32px; }
.stepper-n button { width: 30px; height: 30px; border: 0; background: none; cursor: pointer; font-size: 15px; color: var(--fg); }
.stepper-n input { width: 44px; border: 0; height: 30px; text-align: center; padding: 0; }

#overlay { position: fixed; inset: 0; background: color-mix(in oklch, var(--bg) 88%, transparent); display: none; align-items: center; justify-content: center; flex-direction: column; gap: 10px; z-index: 10; }
#overlay.on { display: flex; }
.bar { width: 220px; height: 4px; background: var(--default); border-radius: 2px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .2s; }
[draggable=true] { cursor: grab; }
dialog { color: var(--fg); background: var(--bg); border: 1px solid var(--field-border); border-radius: 12px; box-shadow: var(--overlay-shadow); padding: 18px; width: min(440px, calc(100% - 32px)); max-height: calc(100% - 40px); }
dialog h2 { font-size: 16px; margin-bottom: 8px; }
dialog ul { padding-left: 20px; font-size: 12px; color: var(--fg2); line-height: 1.65; }
dialog li + li { margin-top: 8px; }
dialog::backdrop { background: oklch(0.2 0.01 260 / .38); }
.dialog-actions { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; margin-top: 18px; }
@media (max-width: 440px) {
  header { gap: 8px; }
  .utility-label { display: none; }
  .header-actions .utility { width: 32px; padding: 0; }
  .step { font-size: 11px; gap: 4px; }
  .step .n { width: 20px; height: 20px; }
}
@media (max-width: 400px) {
  header, main, footer { padding-left: 14px; padding-right: 14px; }
  .output-settings .row > .lbl { width: 52px; }
}
